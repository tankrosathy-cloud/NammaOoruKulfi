<!doctype html>
<html lang="en">
  <head>
    <script>
      // Gracefully prevent unhandled WebSocket closure errors from Vite HMR in iframe preview
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.includes('WebSocket') || msg.includes('ws') || msg.includes('@vite/client')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + ' ' + (event && event.filename || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
          event.preventDefault();
        }
      });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Namma Ooru Kulfi</title>
    <meta name="description" content="Mobile dashboard for Namma Ooru Kulfi business tracking sales, inventory, and monthly financials." />
    <meta property="og:title" content="Namma Ooru Kulfi" />
    <meta property="og:description" content="Mobile dashboard for Namma Ooru Kulfi business tracking sales, inventory, and monthly financials." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
